<!DOCTYPE html>
<html>
<head>
    <title>Student Details</title>
</head>
<style>
    .c1{
        background-color:rgb(106, 186, 236);

    }
</style>
<body class="c1">
    <h1>Student Details</h1>
    <h2>Name: {{ student.name }}</h2>
    <p>Age: {{ student.age }}</p>
    <p>Mark: {{ student.mark }}</p>
    {% if student.mark >= 40 %}
        <h4>Result: Pass</h4>
    {% else %}
        <h4>Result: Fail</h4>
    {% endif %}
    <br>
    <a href="{% url 'students' %}">
        Back to Student List
    </a>
</body>
</html>
