<!DOCTYPE html>
<html>
<head>
    <title>Student Management</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            font-family: Arial, sans-serif;
            max-width: 800px;
            margin: 40px auto;
            padding: 0 20px;
            background-color: #5096db;
            color: #333;
        }

        h1 {
            text-align: center;
            color: #2c3e50;
            border-bottom: 3px solid #083e62;
            padding-bottom: 10px;
            margin-bottom: 30px;
        }
        .student-card {
            background-color: #eda0d8;
            border-radius: 10px;
            padding: 20px 25px;
            margin-bottom: 20px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
        }
        .student-card h3 {
            font-size: 20px;
            color: #2c3e50;
            margin-bottom: 10px;
        }
        .student-card p {
            font-size: 15px;
            color: #555;
            margin: 5px 0;
        }
        .badge {
            display: inline-block;
            margin: 10px 0;
            padding: 5px 14px;
            border-radius: 20px;
            font-size: 14px;
            font-weight: bold;
            color: #fff;
        }
        .btn {
            display: inline-block;
            margin-top: 12px;
            padding: 8px 18px;
            background-color: #3498db;
            color: #fff;
            text-decoration: none;
            border-radius: 6px;
            font-size: 14px;
            font-weight: bold;
        }
        .btn:hover {
            background-color: #2980b9;
        }
    </style>
</head>
<body>
    <h1>Student List</h1>
    {% for student in students %}
        <div class="student-card">
            <h3>{{ student.name }}</h3>
            <p><strong>Age:</strong> {{ student.age }}</p>
            <p><strong>Mark:</strong> {{ student.mark }}</p>
            <br>
          <a href="{% url 'student_details' student.id %}">
            View Details
        </a>
        </div>
    {% endfor %}
</body>
</html>
