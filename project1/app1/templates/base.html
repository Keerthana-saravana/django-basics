<!DOCTYPE html>
<html>
<head>
    <title>Student Website</title>
    <style>
        body {
            font-family: Arial;
            margin: 0;
            background-color: #f2f2f2;
        }
        header {
            background-color: #333;
            color: white;
            padding: 20px;
            text-align: center;
        }
        nav {
            background-color: #555;
            padding: 15px;
            text-align: center;
        }
        nav a {
            color: white;
            text-decoration: none;
            margin: 20px;
            font-size: 18px;
        }
       

 .content {
            background-color: white;
            width: 70%;
            margin: 30px auto;
            padding: 30px;
            text-align: center;
        }
        footer {
            background-color: #333;
            color: white;
            text-align: center;
            padding: 15px;
        }
    </style>
</head>
<body>
    <header>
        <h1>Demo</h1>
    </header>
    {% include "navbar.html" %}
    <div class="content">
        {% block content %}
        {% endblock %}
    </div>
    <footer>
        <p>www.yuvasakthiacademy.com</p>
    </footer>
</body>
</html>
